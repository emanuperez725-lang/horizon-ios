name: ios
# The iOS port's Horizon.ipa, signed ad hoc for sideloading (packaging/ios/README.md). It builds
# the game only and holds no game files. Upstream's workflows are not in this fork: they need
# its own runners.
on:
  push:
    branches: [ios-port]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      HORIZON_VERSION: ios-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from failed builds too: the dependencies compile once while the port's own
          # errors are fixed.
          cache-on-failure: true
      - name: Test the touch layout
        run: cargo test -p horizon-client-input touch
      # No controllers (gilrs has no iOS backend) and no code mods (wasmtime needs a JIT).
      - name: Build the game for iOS
        run: >
          cargo build --profile fast --target aarch64-apple-ios
          -p horizon-client --bin horizon-client
          --no-default-features --features audio
      - name: Package Horizon.ipa
        run: bash packaging/ios/package.sh target/aarch64-apple-ios/fast/horizon-client
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ipa
          path: dist/Horizon.ipa
          if-no-files-found: error
